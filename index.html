<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KKdrill · 小夏专供 v1.8</title>
<style>
  :root { --bg:#1b1e23; --panel:#262a31; --fg:#e8e6e3; --dim:#9aa0a6; --accent:#e57373; --ok:#81c784; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"Yu Gothic","Meiryo","Hiragino Kaku Gothic ProN",sans-serif; display:flex; justify-content:center; }
  #app { width:100%; max-width:720px; padding:16px; }
  header { display:flex; justify-content:space-between; align-items:baseline; color:var(--dim); font-size:13px; margin-bottom:12px; flex-wrap:wrap; gap:6px; }
  #bar { height:5px; background:#333; border-radius:3px; overflow:hidden; margin-bottom:20px; }
  #bar i { display:block; height:100%; background:var(--accent); width:0; transition:width .2s; }
  #card { background:var(--panel); border-radius:12px; padding:28px 24px; }
  #tag { color:var(--dim); font-size:12px; margin-bottom:14px; }
  #jp { font-size:26px; line-height:1.7; margin-bottom:14px; }
  #jp b { color:var(--accent); font-weight:normal; }
  #zh { color:var(--dim); font-size:16px; line-height:1.6; }
  #inputrow { margin-top:24px; display:flex; gap:8px; max-width:100%; }
  #inputrow button { white-space:nowrap; flex-shrink:0; padding:10px 12px; }
  #ans { flex:1; min-width:0; background:#15171b; border:2px solid #3a3f47; border-radius:8px; color:var(--fg);
         font-size:22px; padding:10px 14px; outline:none; font-family:inherit; }
  rt { font-size:0.55em; color:var(--dim); }
  body.no-rt rt { display:none; }
  #ans:focus { border-color:var(--accent); }
  button { background:#3a3f47; color:var(--fg); border:none; border-radius:8px; padding:10px 16px;
           font-size:15px; cursor:pointer; font-family:inherit; }
  button:hover { background:#4a5058; }
  button.primary { background:var(--accent); color:#1b1e23; font-weight:bold; }
  #feedback { margin-top:18px; font-size:16px; line-height:1.8; display:none; }
  #feedback.ok { color:var(--ok); }
  #feedback.ng { color:var(--accent); }
  #feedback .rule { color:var(--dim); font-size:14px; border-top:1px solid #3a3f47; margin-top:10px; padding-top:10px; }
  .hint { color:#e5c07b; font-size:14px; margin-top:6px; }
  #sub { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
  #summary { display:none; text-align:center; padding:40px 0; }
  #summary h2 { margin:0 0 16px; }
  #summary .btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:20px; }
  .hidden { display:none !important; }
  /* 进度面板 */
  #overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:10; justify-content:center; align-items:flex-start; padding:24px 12px; overflow-y:auto; }
  #prog { background:var(--panel); border-radius:12px; padding:24px; width:100%; max-width:560px; }
  #prog h2 { margin:0 0 16px; font-size:18px; }
  .nums { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  .num { background:#15171b; border-radius:8px; padding:10px 14px; text-align:center; flex:1; min-width:80px; }
  .num b { display:block; font-size:24px; }
  .num span { color:var(--dim); font-size:12px; }
  .num b.warn { color:var(--accent); }
  .num b.good { color:var(--ok); }
  .boxrow { display:flex; align-items:center; gap:8px; margin:4px 0; font-size:12px; color:var(--dim); }
  .boxrow .lbl { width:44px; text-align:right; }
  .boxrow .bar { height:14px; background:var(--accent); border-radius:3px; min-width:2px; }
  .boxrow .cnt { width:30px; }
  #weak { margin-top:16px; font-size:14px; line-height:1.9; }
  #weak li { color:var(--fg); }
  .sec { color:var(--dim); font-size:13px; margin:16px 0 8px; border-top:1px solid #3a3f47; padding-top:12px; }
  /* 头部按钮组：手机端紧凑换行 */
  #hdr-btns { display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; }
  #hdr-btns button, #hdr-btns select { padding:7px 10px !important; font-size:13px; }
  /* 热度图 */
  .hm { display:flex; gap:2px; overflow-x:auto; padding-bottom:4px; }
  .hm .wk { display:flex; flex-direction:column; gap:2px; }
  .hm i { width:11px; height:11px; border-radius:2px; background:#2a2e35; }
  .hm i.lv1 { background:rgba(229,115,115,.3); }
  .hm i.lv2 { background:rgba(229,115,115,.5); }
  .hm i.lv3 { background:rgba(229,115,115,.75); }
  .hm i.lv4 { background:var(--accent); }
</style>
</head>
<body>
<div id="app">
  <header>
    <span id="title">KKdrill <small style="color:var(--dim);font-size:11px;">v1.8</small></span>
    <span><span id="due-badge" title="今日到期（SRS 待复习量）"></span> <span id="progress"></span></span>
    <span id="hdr-btns">
      <select id="sel-size" title="每轮题量" style="background:#15171b;color:#e8e6e3;border:1px solid #3a3f47;border-radius:6px;padding:5px;font-family:inherit;">
        <option value="5">每轮 5 张</option>
        <option value="8" selected>每轮 8 张</option>
        <option value="10">每轮 10 张</option>
        <option value="all">全部</option>
      </select>
      <button id="btn-ruby" title="振り仮名 on/off">あ</button>
      <button id="btn-prog" title="学习统计">📊 统计</button>
      <button id="btn-cloud" title="上云：错题日志发给 kk 判案">☁️ 上云</button>
    </span>
  </header>
  <div id="bar"><i></i></div>

  <div id="card">
    <div id="tag" style="visibility:hidden;">&nbsp;</div>
    <div id="jp"></div>
    <div id="zh"></div>
    <div id="inputrow">
      <input id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
             inputmode="latin" lang="en" placeholder="ローマ字で入力…">
      <button class="primary" id="btn-submit">判定</button>
    </div>
    <div id="sub">
      <button id="btn-pass">不会</button>
    </div>
    <div id="feedback"></div>
    <div id="sub2" class="hidden" style="margin-top:14px;">
      <button class="primary" id="btn-next">继续 →</button>
    </div>
  </div>

  <div id="summary">
    <h2 id="sum-title"></h2>
    <div id="sum-body" style="color:var(--dim)"></div>
    <div class="btns">
      <button class="primary" id="btn-restart">再来一轮</button>
      <button class="primary hidden" id="btn-force">加练一轮（含未到期）</button>
      <button id="btn-export2">复制错题日志</button>
    </div>
  </div>
</div>

<div id="overlay">
  <div id="prog">
    <h2>学习统计</h2>
    <div class="nums" id="prog-nums"></div>
    <div class="sec">记忆曲线分布（每格＝复习间隔）</div>
    <div id="prog-boxes"></div>
    <div class="sec">每日学习量（近 14 天，单位：张）</div>
    <div id="prog-daily"></div>
    <div class="sec">热度图（近 17 周，颜色越深刷得越多）</div>
    <div id="prog-heat" class="hm"></div>
    <div class="sec">薄弱点 TOP5（按历史错题次数，双端云同步）</div>
    <ol id="weak" style="margin:0;padding-left:22px;"></ol>
    <div style="text-align:center;margin-top:10px;"><button id="btn-export3">复制错题日志</button></div>
    <div class="sec">进度云同步（每台设备第一次先点一次「上云」配好地址密钥）</div>
    <div style="display:flex;gap:10px;justify-content:center;">
      <button id="btn-bak">备份进度到云</button>
      <button id="btn-res">从云恢复进度</button>
    </div>
    <div id="bak-info" style="text-align:center;color:var(--dim);font-size:12px;margin-top:8px;"></div>
    <div style="text-align:center;margin-top:10px;"><button id="btn-closeprog">关闭</button></div>
  </div>
</div>

<script>
/* ===== 卡组（由 语法卡组源.json 生成，改卡请改源文件后跑 .reasonix/gen_deck.py） ===== */
const DECK = [{"id":"g001","tag":"语法::N4::ておく","jp":"<ruby>明日<rt>あした</rt></ruby>の<ruby>会議<rt>かいぎ</rt></ruby>のために、<ruby>資料<rt>しりょう</rt></ruby>を＿＿＿＿。（コピーする）","zh":"为了明天的会议，先把资料复印好。","ans":["コピーしておく","コピーしておきます"],"rule":"提前准备好→Vて＋おく（口语缩成 とく）","base":"こぴーする"},{"id":"g002","tag":"语法::N4::てしまう","jp":"<ruby>大事<rt>だいじ</rt></ruby>な<ruby>書類<rt>しょるい</rt></ruby>を＿＿＿＿。（なくす・过去）","zh":"把重要的文件弄丢了（糟糕）。","ans":["なくしてしまった","なくしちゃった","なくしてしまいました"],"rule":"完了/遗憾→Vて＋しまう（口语 ちゃう）","base":"なくす"},{"id":"g003","tag":"语法::N4::そうだ样态","jp":"このケーキはおいし＿＿＿＿。","zh":"这个蛋糕看起来很好吃。","ans":["そうだ","そうです","そう"],"rule":"样态そうだ＝看起来…：い形去い、ナ形去だ、动词去ます，直接接"},{"id":"g004","tag":"语法::N4::そうだ传闻","jp":"<ruby>明日<rt>あした</rt></ruby>は<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>る＿＿＿＿。","zh":"听说明天会下雨。","ans":["そうだ","そうです"],"rule":"传闻そうだ＝听说…：接普通形（降るそうだ）。样态是 降りそうだ，一对别混"},{"id":"g005","tag":"语法::N4::ようだ","jp":"<ruby>彼<rt>かれ</rt></ruby>は<ruby>疲<rt>つか</rt></ruby>れている＿＿＿＿。","zh":"他好像很累。（有根据的推测）","ans":["ようだ","ようです"],"rule":"ようだ＝有根据的推测，接普通形（Nの/ナ形な＋ようだ）"},{"id":"g006","tag":"语法::N4::らしい","jp":"<ruby>彼女<rt>かのじょ</rt></ruby>は<ruby>来<rt>こ</rt></ruby>ない＿＿＿＿。","zh":"她好像不来了。（听来的/客观迹象）","ans":["らしい","らしいです"],"rule":"らしい＝客观迹象/听闻的推测，直接接普通形"},{"id":"g007","tag":"语法::N4::受身","jp":"<ruby>私<rt>わたし</rt></ruby>は<ruby>先生<rt>せんせい</rt></ruby>に＿＿＿＿。（ほめる・过去）","zh":"我被老师表扬了。","ans":["ほめられた","ほめられました","褒められた"],"rule":"被动：五段あ列＋れる（ほめる→ほめられる），过去变 た","base":"ほめる"},{"id":"g008","tag":"语法::N4::使役","jp":"<ruby>母<rt>はは</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>に<ruby>野菜<rt>やさい</rt></ruby>を＿＿＿＿。（<ruby>食<rt>た</rt></ruby>べる・过去）","zh":"妈妈让我吃了蔬菜。","ans":["食べさせた","食べさせました","たべさせた"],"rule":"使役：一段去る＋させる；五段あ列＋せる","base":"たべる"},{"id":"g009","tag":"语法::N4::のに转折","jp":"<ruby>約束<rt>やくそく</rt></ruby>した＿＿＿＿、<ruby>彼<rt>かれ</rt></ruby>は<ruby>来<rt>こ</rt></ruby>なかった。","zh":"明明约好了，他却没来。","ans":["のに"],"rule":"のに＝明明…却（带不满），普通形直接接（N/ナ形用 なのに）"},{"id":"g010","tag":"语法::N4::ば","jp":"<ruby>安<rt>やす</rt></ruby>＿＿＿＿、<ruby>買<rt>か</rt></ruby>います。","zh":"便宜的话就买。","ans":["ければ"],"rule":"ば条件：い形去い＋ければ；五段う列→え列＋ば；一段去る＋れば"},{"id":"g011","tag":"语法::N4::たら","jp":"<ruby>家<rt>いえ</rt></ruby>に＿＿＿＿、<ruby>電話<rt>でんわ</rt></ruby>してください。（<ruby>帰<rt>かえ</rt></ruby>る）","zh":"到家之后请给我打电话。","ans":["帰ったら","かえったら"],"rule":"たら＝…之后/如果…：た形＋ら。帰る是五段刺头→帰った","base":"かえる"},{"id":"g012","tag":"语法::N4::てくる","jp":"<ruby>日本語<rt>にほんご</rt></ruby>が<ruby>上手<rt>じょうず</rt></ruby>に＿＿＿＿。（なる・过去）","zh":"日语渐渐变好了。","ans":["なってきた","なってきました"],"rule":"Vて＋くる＝变化开始/持续到现在（渐渐…起来）","base":"なる"},{"id":"g013","tag":"语法::插队::得る","jp":"その<ruby>言<rt>い</rt></ruby>い<ruby>方<rt>かた</rt></ruby>は<ruby>恐喝<rt>きょうかつ</rt></ruby>にも＿＿＿＿から、やめた<ruby>方<rt>ほう</rt></ruby>がいい。（なる）【书面】","zh":"那种说法也可能构成恐吓，还是别说了。","ans":["なり得る","なりえる","なりうる"],"rule":"得る＝有可能（书面）：ます词干＋得る。なる→なり得る，し得る只属于する一家","base":"なる"},{"id":"g014","tag":"语法::插队::ざるを得ない","jp":"サプライズのプレゼントに、＿＿＿＿。（<ruby>驚<rt>おどろ</rt></ruby>く・不得不・过去）","zh":"惊喜礼物让我不得不惊叹。","ans":["驚かざるを得なかった","驚かざるをえなかった","おどろかざるをえなかった"],"rule":"ざるを得ない＝不得不：あ列＋ざるを得ない（する→せ）。驚く是自己惊，驚かす是吓人","base":"おどろく"},{"id":"g015","tag":"语法::插队::つもりで","jp":"ご<ruby>馳走<rt>ちそう</rt></ruby>する＿＿＿＿<ruby>行<rt>い</rt></ruby>ったのに、おごってもらうことになった。","zh":"抱着请客的打算去了，结果变成被请。","ans":["つもりで"],"rule":"つもりで＝怀着…打算做（中顿），普通形直接贴，不塞の；结句用つもりだ"},{"id":"g016","tag":"语法::插队::よりほかない","jp":"<ruby>教養<rt>きょうよう</rt></ruby>がなさすぎる。<ruby>勉強<rt>べんきょう</rt></ruby>する＿＿＿＿。","zh":"太没教养了，除了学习别无选择。","ans":["よりほかない","より他ない"],"rule":"Vる＋よりほかない＝只能…。より→ほか→ない 语序焊死，无も"},{"id":"g017","tag":"语法::插队::推量副词","jp":"＿＿＿＿、<ruby>今週<rt>こんしゅう</rt></ruby>の<ruby>会議<rt>かいぎ</rt></ruby>は、<ruby>空気<rt>くうき</rt></ruby>が<ruby>重<rt>おも</rt></ruby>かったよね。","zh":"For some reason，这周会议气氛很沉重。","ans":["何やら","なにやら"],"rule":"当事人语感（亲历/感觉，说不清为啥）→何やら；侦探（看线索推未目击之事）→どうやら"},{"id":"g018","tag":"语法::插队::推量副词","jp":"＿＿＿＿<ruby>今年<rt>ことし</rt></ruby>の<ruby>紅葉<rt>こうよう</rt></ruby>は<ruby>遅<rt>おく</rt></ruby>れているらしい。","zh":"Apparently，今年的红叶晚了。","ans":["どうやら"],"rule":"どうやら＝侦探：线索→未目击的结论，句尾带 らしい/ようだ/みたい 官印"},{"id":"g019","tag":"语法::插队::一応","jp":"ハサミが<ruby>必要<rt>ひつよう</rt></ruby>になるかは<ruby>分<rt>わ</rt></ruby>かりませんが、＿＿＿＿<ruby>持<rt>も</rt></ruby>ってきてください。","zh":"Just in case，请把剪刀带来。","ans":["一応","いちおう"],"rule":"一応＝有备无患（just in case，信号：分からないが/かも）；せめて＝退而求其次（at least，带くらいは）"},{"id":"g020","tag":"语法::插队::せめて","jp":"<ruby>忙<rt>いそが</rt></ruby>しくても、＿＿＿＿<ruby>電話<rt>でんわ</rt></ruby>ぐらいはしてください。","zh":"At least，再忙也请至少打个电话。","ans":["せめて"],"rule":"せめて＝退而求其次/保底（at least），几乎必带 くらいは/ぐらいは 或保底情绪"},{"id":"g021","tag":"语法::N4::ずに","jp":"<ruby>昨日<rt>きのう</rt></ruby>は<ruby>忙<rt>いそが</rt></ruby>しくて、<ruby>夜<rt>よる</rt></ruby>10<ruby>時<rt>じ</rt></ruby>まで<ruby>何<rt>なに</rt></ruby>も＿＿＿＿<ruby>働<rt>はたら</rt></ruby>いた。（<ruby>食<rt>た</rt></ruby>べる）","zh":"昨天太忙了，什么都没吃一直工作到晚上十点。","ans":["食べずに","たべずに"],"rule":"ず（に）＝不…而…（书面＝ないで/なくて）：あ列＋ず（に），する→せず（に）","base":"たべる"},{"id":"g022","tag":"语法::N4::たがる","jp":"わたしの<ruby>友<rt>とも</rt></ruby>だちも<ruby>見<rt>み</rt></ruby>＿＿＿＿います。（想看・第三人称）","zh":"我的朋友也想看（那部电影）。","ans":["たがって"],"rule":"第三人称的愿望用 たがる（ます形＋たがる）；たい 只管自己"},{"id":"g023","tag":"语法::N4::がる","jp":"あそこで<ruby>泣<rt>な</rt></ruby>いて、お<ruby>菓子<rt>かし</rt></ruby>を＿＿＿＿いる<ruby>子<rt>こ</rt></ruby>だよ。（想要・第三人称）","zh":"（不是小武，）是那边那个哭着要点心的小孩。","ans":["欲しがって","ほしがって"],"rule":"がる＝第三人称的感情/感受外露：い形・ナ形词干＋がる（欲しい→欲しがる）"},{"id":"g024","tag":"语法::N4::みたいだ","jp":"<ruby>誰<rt>だれ</rt></ruby>か<ruby>教室<rt>きょうしつ</rt></ruby>にいる＿＿＿＿。<ruby>電気<rt>でんき</rt></ruby>が<ruby>付<rt>つ</rt></ruby>いている。","zh":"好像教室里有人。灯开着呢。","ans":["みたいだ","みたいです"],"rule":"みたいだ＝口语版 ようだ（主观判断）：接普通形，N/ナ形直接接不加 の/な"},{"id":"g025","tag":"语法::N4::使役被动","jp":"お<ruby>腹<rt>なか</rt></ruby>が<ruby>痛<rt>いた</rt></ruby>くて<ruby>病院<rt>びょういん</rt></ruby>へ<ruby>行<rt>い</rt></ruby>ったら、1<ruby>時間<rt>じかん</rt></ruby>も＿＿＿＿。（<ruby>待<rt>ま</rt></ruby>つ・被迫）","zh":"肚子疼去医院，居然让我等了一个小时。","ans":["待たされた","待たされました","またされた"],"rule":"被迫→使役被动：五段あ列＋される（待つ→待たされる），两步法","base":"まつ"},{"id":"g026","tag":"语法::N4::禁止な","jp":"ここに<ruby>車<rt>くるま</rt></ruby>を＿＿＿＿。<ruby>邪魔<rt>じゃま</rt></ruby>だ。（<ruby>止<rt>と</rt></ruby>める・禁止）","zh":"别在这里停车，挡住路了。","ans":["止めるな","とめるな"],"rule":"禁止：辞书形＋な（语气强，告示/上对下）","base":"とめる"},{"id":"g027","tag":"语法::N4::ていく","jp":"<ruby>学校<rt>がっこう</rt></ruby>を<ruby>卒業<rt>そつぎょう</rt></ruby>しても、<ruby>日本語<rt>にほんご</rt></ruby>の<ruby>勉強<rt>べんきょう</rt></ruby>を<ruby>続<rt>つづ</rt></ruby>けて＿＿＿＿つもりだ。（いく/くる）","zh":"即使毕业了，也打算继续学日语下去。","ans":["いく"],"rule":"ていく＝从现在持续下去/远去；てくる＝持续到现在。时间点往后→いく"},{"id":"g028","tag":"语法::N4::てみる","jp":"すみません、この<ruby>帽子<rt>ぼうし</rt></ruby>、<ruby>被<rt>かぶ</rt></ruby>って＿＿＿＿もいいですか。","zh":"不好意思，这顶帽子我可以戴戴看吗？","ans":["みて"],"rule":"てみる＝试着…看"},{"id":"g029","tag":"语法::N4::んです","jp":"A「<ruby>明日<rt>あした</rt></ruby>、<ruby>一緒<rt>いっしょ</rt></ruby>に<ruby>出<rt>で</rt></ruby>かけませんか。」B「<ruby>明日<rt>あした</rt></ruby>は<ruby>友<rt>とも</rt></ruby>だちがうちに<ruby>来<rt>く</rt></ruby>る<ruby>予定<rt>よてい</rt></ruby>＿＿＿＿。」","zh":"（解释原因）明天朋友要来我家。","ans":["なんです","なのです"],"rule":"解释说明→んです（口语）/のです（书面）；N・ナ形用 なんです"},{"id":"g030","tag":"语法::N4::てもいい","jp":"すみません、ここで<ruby>写真<rt>しゃしん</rt></ruby>を<ruby>撮<rt>と</rt></ruby>って＿＿＿＿ですか。","zh":"不好意思，可以在这里拍照吗？","ans":["もいい"],"rule":"许可：てもいい（请求许可 てもいいですか）"},{"id":"g031","tag":"语法::N4::てはいけない","jp":"<ruby>授業中<rt>じゅぎょうちゅう</rt></ruby>、<ruby>電話<rt>でんわ</rt></ruby>をかけて＿＿＿＿。","zh":"上课时间不准打电话。","ans":["はいけません","はいけない"],"rule":"禁止（上对下/规则）：てはいけない"},{"id":"g032","tag":"语法::N4::なければならない","jp":"<ruby>食事<rt>しょくじ</rt></ruby>の<ruby>前<rt>まえ</rt></ruby>には<ruby>必<rt>かなら</rt></ruby>ず<ruby>手<rt>て</rt></ruby>を＿＿＿＿なりません。（<ruby>洗<rt>あら</rt></ruby>う）","zh":"吃饭前必须洗手。","ans":["洗わなければ","あらわなければ"],"rule":"必须＝ない形去い＋ければならない/いけない（口语 なきゃ）。う结尾→わ","base":"あらう"},{"id":"g033","tag":"语法::N4::なくてもいい","jp":"<ruby>病気<rt>びょうき</rt></ruby>が<ruby>治<rt>なお</rt></ruby>ったから、<ruby>薬<rt>くすり</rt></ruby>を＿＿＿＿もいいです。（<ruby>飲<rt>の</rt></ruby>む）","zh":"因为病已经好了，不吃药也不要紧。","ans":["飲まなくて","のまなくて"],"rule":"不必→なくてもいい（＝なくてもかまわない）","base":"のむ"},{"id":"g034","tag":"语法::N4::すぎる","jp":"たばこの＿＿＿＿はよくないですよ。（<ruby>吸<rt>す</rt></ruby>う）","zh":"抽太多烟不好的。","ans":["吸いすぎ","すいすぎ"],"rule":"过于→ます形＋すぎる（Ⅱ类活用）；名词形 〜すぎ（飲みすぎ）","base":"すう"},{"id":"g035","tag":"语法::N4::だす","jp":"<ruby>今<rt>いま</rt></ruby>まで<ruby>寝<rt>ね</rt></ruby>ていた<ruby>赤<rt>あか</rt></ruby>ちゃんが<ruby>急<rt>きゅう</rt></ruby>に＿＿＿＿。（<ruby>泣<rt>な</rt></ruby>く・过去）","zh":"一直睡着的婴儿突然哭了起来。","ans":["泣きだした","泣き出した","なきだした"],"rule":"开始…→ます形＋だす","base":"なく"},{"id":"g036","tag":"语法::N4::つづける","jp":"1<ruby>時間<rt>じかん</rt></ruby>ぐらい＿＿＿＿ので、のどが<ruby>渇<rt>かわ</rt></ruby>いた。（<ruby>話<rt>はな</rt></ruby>す・过去）","zh":"因为一直说了将近一个小时，嗓子干了。","ans":["話しつづけた","話し続けた","はなしつづけた"],"rule":"持续…→ます形＋つづける（前接持续性动词）","base":"はなす"},{"id":"g037","tag":"语法::N4::やすい","jp":"このペンは＿＿＿＿ですね。（<ruby>書<rt>か</rt></ruby>く）","zh":"这支笔很好写。","ans":["書きやすい","かきやすい"],"rule":"容易→ます形＋やすい（い形容词活用）；反义 にくい","base":"かく"},{"id":"g038","tag":"语法::N4::にくい","jp":"<ruby>彼<rt>かれ</rt></ruby>の<ruby>名前<rt>なまえ</rt></ruby>は<ruby>長<rt>なが</rt></ruby>くて＿＿＿＿。（<ruby>覚<rt>おぼ</rt></ruby>える）","zh":"他的名字很长，很难记。","ans":["覚えにくい","おぼえにくい"],"rule":"难以→ます形＋にくい（客观条件导致）","base":"おぼえる"},{"id":"g039","tag":"语法::N4::うちに","jp":"<ruby>若<rt>わか</rt></ruby>い＿＿＿＿、いろいろな<ruby>国<rt>くに</rt></ruby>へ<ruby>旅行<rt>りょこう</rt></ruby>したいです。","zh":"想趁着年轻去很多国家旅游。","ans":["うちに"],"rule":"趁着…→普通形＋うちに；ないうちに＝趁没…"},{"id":"g040","tag":"语法::N4::ところ","jp":"これから<ruby>食事<rt>しょくじ</rt></ruby>に＿＿＿＿なんですが、<ruby>一緒<rt>いっしょ</rt></ruby>にいかがですか。（<ruby>行<rt>い</rt></ruby>く）","zh":"我正打算去吃饭，你也一起去吗？","ans":["行くところ","いくところ"],"rule":"正要…→辞书形＋ところ（だ）；たところ＝刚…完","base":"いく"},{"id":"g041","tag":"语法::N4::た形促音便","jp":"<ruby>昨日<rt>きのう</rt></ruby>、デパートで<ruby>帽子<rt>ぼうし</rt></ruby>を＿＿＿＿。（<ruby>買<rt>か</rt></ruby>う・过去）","zh":"昨天在百货商场买了帽子。","ans":["買った","かった"],"rule":"五段た形①促音便：う/つ/る→った（かう→かった、まつ→まった、かえる→かえった）。だら错了想想是不是促音便没到位","base":"かう"},{"id":"g042","tag":"语法::N4::た形鼻音便","jp":"<ruby>昨晚<rt>ゆうべ</rt></ruby>、<ruby>友<rt>とも</rt></ruby>だちとビールを＿＿＿＿。（<ruby>飲<rt>の</rt></ruby>む・过去）","zh":"昨晚和朋友喝了啤酒。","ans":["飲んだ","のんだ"],"rule":"五段た形②鼻音便：む/ぶ/ぬ→んだ（のむ→のんだ、あそぶ→あそんだ）。て形同理：のんで","base":"のむ"}];
/* ===== 卡组结束 ===== */

/* ===== 罗马音→假名转换器（Bunpro 式：英文键盘直输，绕开输入法联想） ===== */
const R2H = {
  a:"あ",i:"い",u:"う",e:"え",o:"お",
  ka:"か",ki:"き",ku:"く",ke:"け",ko:"こ", ga:"が",gi:"ぎ",gu:"ぐ",ge:"げ",go:"ご",
  sa:"さ",shi:"し",si:"し",su:"す",se:"せ",so:"そ", za:"ざ",ji:"じ",zi:"じ",zu:"ず",ze:"ぜ",zo:"ぞ",
  ta:"た",chi:"ち",ti:"ち",tsu:"つ",tu:"つ",te:"て",to:"と", da:"だ",di:"ぢ",du:"づ",de:"で",do:"ど",
  na:"な",ni:"に",nu:"ぬ",ne:"ね",no:"の",
  ha:"は",hi:"ひ",fu:"ふ",hu:"ふ",he:"へ",ho:"ほ", ba:"ば",bi:"び",bu:"ぶ",be:"べ",bo:"ぼ",
  pa:"ぱ",pi:"ぴ",pu:"ぷ",pe:"ぺ",po:"ぽ",
  ma:"ま",mi:"み",mu:"む",me:"め",mo:"も",
  ya:"や",yu:"ゆ",yo:"よ",
  ra:"ら",ri:"り",ru:"る",re:"れ",ro:"ろ",
  wa:"わ",wo:"を",
  kya:"きゃ",kyu:"きゅ",kyo:"きょ", gya:"ぎゃ",gyu:"ぎゅ",gyo:"ぎょ",
  sha:"しゃ",shu:"しゅ",sho:"しょ",she:"しぇ", sya:"しゃ",syu:"しゅ",syo:"しょ",
  ja:"じゃ",ju:"じゅ",jo:"じょ",je:"じぇ", jya:"じゃ",jyu:"じゅ",jyo:"じょ", zya:"じゃ",zyu:"じゅ",zyo:"じょ",
  cha:"ちゃ",chu:"ちゅ",cho:"ちょ",che:"ちぇ", tya:"ちゃ",tyu:"ちゅ",tyo:"ちょ",
  nya:"にゃ",nyu:"にゅ",nyo:"にょ", hya:"ひゃ",hyu:"ひゅ",hyo:"ひょ",
  bya:"びゃ",byu:"びゅ",byo:"びょ", pya:"ぴゃ",pyu:"ぴゅ",pyo:"ぴょ",
  mya:"みゃ",myu:"みゅ",myo:"みょ", rya:"りゃ",ryu:"りゅ",ryo:"りょ",
  fa:"ふぁ",fi:"ふぃ",fe:"ふぇ",fo:"ふぉ", wi:"うぃ",we:"うぇ"
};
const R2H_PREFIX = new Set();
for (const k of Object.keys(R2H)) for (let i = 1; i <= k.length; i++) R2H_PREFIX.add(k.slice(0, i));

let kanaBuf = [];   // 已确定的假名（逐字）
let pending = "";   // 未确定的罗马音（如 "k"、"sh"）

function feed(ch) {
  if (ch === "-") {               // 长音
    if (pending === "n") { kanaBuf.push("ん"); pending = ""; }
    kanaBuf.push("ー");
    return;
  }
  pending += ch;
  for (;;) {
    if (!pending) break;
    if (R2H[pending]) { kanaBuf.push(...R2H[pending]); pending = ""; continue; }
    if (pending === "n'") { kanaBuf.push("ん"); pending = ""; continue; }
    const p0 = pending[0];
    if (pending.length >= 2 && p0 === "n" && !"aiueoy".includes(pending[1])) {
      kanaBuf.push("ん"); pending = pending.slice(1); continue;
    }
    if (pending.length >= 2 && p0 === pending[1] && !"aiueon'-".includes(p0)) {
      kanaBuf.push("っ"); pending = pending.slice(1); continue;
    }
    if (R2H_PREFIX.has(pending)) break;   // 还可能是某个音节的前缀，等下一个字母
    kanaBuf.push(p0); pending = pending.slice(1);  // 无法解析，原样放出
  }
}
const syncAns = () => { $("ans").value = kanaBuf.join("") + pending; };
const resetInput = () => { kanaBuf = []; pending = ""; syncAns(); };
/* ===== 转换器结束 ===== */

/* ===== SRS：Leitner 盒记忆曲线（答对升盒，答错回 0 盒，到期才出现） ===== */
const INTERVALS = [0, 864e5, 2*864e5, 4*864e5, 7*864e5, 15*864e5, 30*864e5, 60*864e5];
const BOX_LABELS = ["新/错", "1天", "2天", "4天", "7天", "15天", "30天", "60天"];

const kata2hira = s => s.replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
const norm = s => kata2hira((s||"").normalize("NFKC").trim().replace(/\s+/g,"")).toLowerCase();
const $ = id => document.getElementById(id);
const dayStr = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

let stats = JSON.parse(localStorage.getItem("jpGrammarStats.v1") || "{}");
let log   = JSON.parse(localStorage.getItem("jpGrammarLog.v1")   || "[]");
const saveStats = () => localStorage.setItem("jpGrammarStats.v1", JSON.stringify(stats));
const saveLog   = () => localStorage.setItem("jpGrammarLog.v1",   JSON.stringify(log));

// 错题次数 & 每日学习量（随进度一起上云，max 合并）
let wrong = JSON.parse(localStorage.getItem("jpGrammarWrong.v1") || "null");
if (!wrong) {  // 老数据迁移：从本地错题日志数一遍
  wrong = {};
  for (const e of log) if (!e.ok) wrong[e.id] = (wrong[e.id] || 0) + 1;
  localStorage.setItem("jpGrammarWrong.v1", JSON.stringify(wrong));
}
let daily = JSON.parse(localStorage.getItem("jpGrammarDaily.v1") || "null");
if (!daily) {  // 老数据只有活跃日，数量记 1，从今天起精确记
  daily = {};
  for (const d of JSON.parse(localStorage.getItem("jpGrammarDays") || "[]")) daily[d] = 1;
  localStorage.setItem("jpGrammarDaily.v1", JSON.stringify(daily));
}
const saveWrong = () => localStorage.setItem("jpGrammarWrong.v1", JSON.stringify(wrong));
const saveDaily = () => localStorage.setItem("jpGrammarDaily.v1", JSON.stringify(daily));
const markStudyDay = () => {
  const days = new Set(JSON.parse(localStorage.getItem("jpGrammarDays") || "[]"));
  days.add(dayStr(new Date()));
  localStorage.setItem("jpGrammarDays", JSON.stringify([...days]));
};

let queue = [], idx = 0, answered = false, sessionRight = 0, sessionWrong = 0;

const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const cardById = id => DECK.find(c => c.id === id);

// 标题栏常待到复习量（SRS 每日到期数）
function updateDueBadge() {
  const now = Date.now();
  const due = DECK.filter(c => { const st = stats[c.id]; return st && st.due <= now; }).length;
  $("due-badge").textContent = due ? `🔴到期 ${due}` : "✅今日已清";
}

let sessionSize = localStorage.getItem("jpGrammarSessionSize") || "8";
$("sel-size").value = sessionSize;
$("sel-size").onchange = () => {
  sessionSize = $("sel-size").value;
  localStorage.setItem("jpGrammarSessionSize", sessionSize);
  buildQueue(false); render();
};

function buildQueue(force) {
  const now = Date.now();
  // 到期复习优先，新卡填空位（各自洗乱，互不均匀混合，避免新卡挤掉复习）
  const due = DECK.filter(c => { const st = stats[c.id]; return st && st.due <= now; }).map(c => c.id);
  const fresh = DECK.filter(c => !stats[c.id]).map(c => c.id);
  shuffle(due); shuffle(fresh);
  queue = due.concat(fresh);
  if (!queue.length && force) { queue = DECK.map(c => c.id); shuffle(queue); } // 加练：全量
  if (sessionSize !== "all") queue = queue.slice(0, +sessionSize);
  idx = 0; sessionRight = 0; sessionWrong = 0;
}

function render() {
  updateDueBadge();
  if (!queue.length) return showAllClear();
  if (idx >= queue.length) return showSummary();
  const c = cardById(queue[idx]);
  answered = false;
  $("jp").innerHTML = c.jp.replace(/＿+/g, "<b>＿＿＿＿</b>");
  $("zh").textContent = c.zh;
  resetInput();
  $("ans").disabled = false;
  $("feedback").style.display = "none";
  $("sub2").classList.add("hidden");
  $("btn-submit").classList.remove("hidden");
  $("sub").classList.remove("hidden");
  $("progress").textContent = `${idx+1} / ${queue.length}`;
  $("bar").firstElementChild.style.width = (idx / queue.length * 100) + "%";
  $("ans").focus();
}

// 编辑距离（两个短假名串，O(n*m) 足够）
function editDist(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, (_, i) => { const row = new Array(n + 1).fill(0); row[0] = i; return row; });
  for (let j = 1; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return dp[m][n];
}

// 形态提示：分析错答属于哪种错法（原形交卷 > 词尾错 > 手误；没把握就闭嘴）
// 只差一个音的情况算手误，不算词尾错（词尾错要求差异 ≥ 2 处）
// correct 取所有可接受答案里编辑距离最近的那个（ans[0] 常带汉字，直接比会比不出前缀）
function analyzeAnswer(yours, corrects, base) {
  if (!yours) return "";
  if (base && yours === base)
    return "形态提示：原形直接交卷了——这题要变形，看规则";
  let correct = null, d = Infinity;
  for (const cand of corrects) {
    if (yours === cand) return "";
    const dc = editDist(yours, cand);
    if (dc < d) { d = dc; correct = cand; }
  }
  if (!correct) return "";
  let pre = 0;
  while (pre < yours.length && pre < correct.length && yours[pre] === correct[pre]) pre++;
  if (pre < correct.length && pre >= correct.length * 0.6 && d > 1)
    return `形态提示：词干对，词尾形态错——正确的尾巴是「${correct.slice(pre)}」`;
  if (d === 1)
    return "形态提示：就差一个音，疑似手误";
  return "";
}

function judge(gaveUp) {
  if (answered) return;
  answered = true;
  markStudyDay();
  const _ds = dayStr(new Date());
  daily[_ds] = (daily[_ds] || 0) + 1; saveDaily();
  const c = cardById(queue[idx]);
  if (pending === "n") { kanaBuf.push("ん"); pending = ""; }  // 句尾的 n 算 ん
  syncAns();
  const yours = norm($("ans").value);
  const ok = !gaveUp && c.ans.some(a => norm(a) === yours);
  const hint = ok || gaveUp ? "" : analyzeAnswer(yours, c.ans.map(a => norm(a)), c.base ? norm(c.base) : "");
  const now = Date.now();

  if (ok) {
    sessionRight++;
    const st = stats[c.id] || { box: 0 };
    st.box = Math.min((st.box || 0) + 1, INTERVALS.length - 1);
    st.due = now + INTERVALS[st.box];
    stats[c.id] = st;
  } else {
    sessionWrong++;
    stats[c.id] = { box: 0, due: now };
    log.push({ t: new Date().toISOString(), id: c.id, your: gaveUp ? "(不会)" : $("ans").value, ok: false });
    saveLog();
    wrong[c.id] = (wrong[c.id] || 0) + 1; saveWrong();
    // 错题当场回炉：3 张后再见
    queue.splice(Math.min(idx + 3, queue.length), 0, c.id);
  }
  saveStats();

  const fb = $("feedback");
  fb.style.display = "block";
  fb.className = ok ? "ok" : "ng";
  fb.innerHTML = (ok ? "✓ 正解" : `✗ 正确答案：<b>${c.ans[0]}</b>${gaveUp ? "" : `（你写的：${$("ans").value || "（空）"}）`}`)
               + (hint ? `<div class="hint">${hint}</div>` : "")
               + `<div class="rule">【${c.tag}】${c.rule}</div>`;
  $("ans").disabled = true;
  $("btn-submit").classList.add("hidden");
  $("sub").classList.add("hidden");
  $("sub2").classList.remove("hidden");
  $("btn-next").focus();
}

function next() { idx++; render(); $("bar").firstElementChild.style.width = (idx / queue.length * 100) + "%"; }

function showSummary() {
  $("card").classList.add("hidden");
  $("summary").style.display = "block";
  $("btn-force").classList.add("hidden");
  $("btn-restart").classList.remove("hidden");
  const total = sessionRight + sessionWrong;
  $("sum-title").textContent = `本轮 ${sessionRight} / ${total}`;
  $("sum-body").innerHTML = sessionWrong === 0
    ? "全对！错题日志是空的，去找 kk 报喜。"
    : `错了 ${sessionWrong} 题，已记入错题日志。<br>点上方「上云」或「复制错题日志」，发给 kk 判案。`;
  $("progress").textContent = "完成";
  $("bar").firstElementChild.style.width = "100%";
  backupState(false);  // 每轮结束自动静默备份
}

function showAllClear() {
  $("card").classList.add("hidden");
  $("summary").style.display = "block";
  $("btn-restart").classList.add("hidden");
  $("btn-force").classList.remove("hidden");
  const now = Date.now();
  const future = DECK.map(c => stats[c.id]).filter(st => st && st.due > now).map(st => st.due);
  const nextDue = future.length ? new Date(Math.min(...future)) : null;
  $("sum-title").textContent = "今日份清空 ✓";
  $("sum-body").innerHTML = "没有到期卡片了，记忆曲线让它们各自排队。" +
    (nextDue ? `<br>最早一批到期：<b style="color:var(--fg)">${nextDue.getMonth()+1}月${nextDue.getDate()}日</b>` : "") +
    "<br>闲不住就点下面加练。";
  $("progress").textContent = "今日已清";
  $("bar").firstElementChild.style.width = "100%";
}

function buildLogText() {
  const lines = ["# 错题日志（语法drill）", `# 导出时间：${new Date().toLocaleString()}`, ""];
  for (const e of log.filter(e => !e.ok)) {
    const c = cardById(e.id);
    lines.push(`[${e.t}] ${e.id} ${c ? c.tag : ""}`);
    lines.push(`  题目：${c ? c.jp.replace(/<[^>]+>/g, "") : "?"}`);
    lines.push(`  你的答案：${e.your}`);
    lines.push(`  正确答案：${c ? c.ans[0] : "?"}${c && c.ans.length > 1 ? "（也可：" + c.ans.slice(1).join(" / ") + "）" : ""}`);
    lines.push(`  规则：${c ? c.rule : "?"}`);
    lines.push("");
  }
  return lines.join("\n");
}

async function exportLog(copyOnly) {
  const text = buildLogText();
  if (!copyOnly && window.showSaveFilePicker) {
    try {
      const h = await showSaveFilePicker({
        suggestedName: "错题日志.txt",
        types: [{ description: "文本", accept: { "text/plain": [".txt"] } }]
      });
      const w = await h.createWritable();
      await w.write(text);
      await w.close();
      return alert("已写入文件。把它放在 D:\\学习 下，kk 就能直接读。");
    } catch (e) { if (e.name === "AbortError") return; /* 取消则落到复制 */ }
  }
  try { await navigator.clipboard.writeText(text); alert("错题日志已复制，直接粘给 kk 即可。"); }
  catch {
    const blob = new Blob([text], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "错题日志.txt";
    a.click();
  }
}

/* ===== 进度面板 ===== */
function progData() {
  const now = Date.now();
  let neu = 0, learning = 0, mastered = 0, due = 0;
  const boxCnt = new Array(INTERVALS.length).fill(0);
  for (const c of DECK) {
    const st = stats[c.id];
    if (!st) { neu++; boxCnt[0]++; continue; }
    boxCnt[Math.min(st.box || 0, INTERVALS.length - 1)]++;
    if (st.due <= now) due++;
    if ((st.box || 0) >= 4) mastered++; else learning++;
  }
  const weakTop = Object.entries(wrong)
    .map(([id, n]) => { const c = cardById(id); return [c ? c.tag.replace(/^语法::/, "") : id, n]; })
    .sort((a, b) => b[1] - a[1]).slice(0, 5);
  const days = new Set(JSON.parse(localStorage.getItem("jpGrammarDays") || "[]"));
  const d = new Date();
  if (!days.has(dayStr(d))) d.setDate(d.getDate() - 1);  // 今天没学就从昨天往回数
  let streak = 0;
  while (days.has(dayStr(d))) { streak++; d.setDate(d.getDate() - 1); }
  return { neu, learning, mastered, due, boxCnt, weakTop, streak, total: DECK.length };
}

function showProgress() {
  const p = progData();
  $("prog-nums").innerHTML =
    `<div class="num"><b>${p.due}</b><span>今日到期</span></div>` +
    `<div class="num"><b>${p.neu}</b><span>新卡</span></div>` +
    `<div class="num"><b>${p.learning}</b><span>学习中</span></div>` +
    `<div class="num"><b class="good">${p.mastered}</b><span>熟练(≥7天)</span></div>` +
    `<div class="num"><b class="warn">${p.streak}</b><span>连续学习(天)</span></div>`;
  const max = Math.max(1, ...p.boxCnt);
  $("prog-boxes").innerHTML = p.boxCnt.map((n, i) =>
    `<div class="boxrow"><span class="lbl">${BOX_LABELS[i]}</span>` +
    `<span class="bar" style="width:${Math.round(n / max * 70)}%"></span>` +
    `<span class="cnt">${n}</span></div>`).join("");
  // 每日学习量（近 14 天柱状）
  const dlist = [];
  for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); dlist.push(d); }
  const dmax = Math.max(1, ...dlist.map(d => daily[dayStr(d)] || 0));
  $("prog-daily").innerHTML = dlist.map(d => {
    const n = daily[dayStr(d)] || 0;
    return `<div class="boxrow"><span class="lbl">${d.getMonth()+1}/${d.getDate()}</span>` +
      `<span class="bar" style="width:${Math.round(n / dmax * 70)}%"></span><span class="cnt">${n}</span></div>`;
  }).join("");
  renderHeat();
  $("weak").innerHTML = p.weakTop.length
    ? p.weakTop.map(([t, n]) => `<li>${t} <b>×${n}</b></li>`).join("")
    : "<li>暂无错题记录，干净得很。</li>";
  $("overlay").style.display = "flex";
}

// 热度图（GitHub 风格，近 17 周，列＝周，行＝周日~周六）
function renderHeat() {
  const N = 119, today = new Date();
  const cells = [];
  for (let i = N - 1; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const k = dayStr(d), n = daily[k] || 0;
    cells.push({ k, n, wd: d.getDay(), lv: n === 0 ? 0 : n < 5 ? 1 : n < 10 ? 2 : n < 20 ? 3 : 4 });
  }
  let html = "", col = [];
  for (let b = 0; b < cells[0].wd; b++) col.push('<i class="lv0" style="visibility:hidden"></i>');
  for (const c of cells) {
    col.push(`<i class="lv${c.lv}" title="${c.k}：${c.n} 张"></i>`);
    if (col.length === 7) { html += `<div class="wk">${col.join("")}</div>`; col = []; }
  }
  if (col.length) html += `<div class="wk">${col.join("")}</div>`;
  $("prog-heat").innerHTML = html;
}

/* ===== 进度云备份/恢复（同一 Worker，/state 端点） ===== */
function getCloudCfg() {
  const cfg = JSON.parse(localStorage.getItem("jpGrammarCloud") || "null");
  if (!cfg) return null;
  // 清洗地址：只保留域名根，粘成 …/state?key=… 之类的长链也能用
  try { cfg.url = new URL(cfg.url).origin; } catch {}
  return cfg;
}
function statePack() {
  return JSON.stringify({
    v: 2, savedAt: Date.now(), stats, wrong, daily,
    days: JSON.parse(localStorage.getItem("jpGrammarDays") || "[]"),
  });
}
function updateBakInfo() {
  const t = localStorage.getItem("jpGrammarLastBackup");
  $("bak-info").textContent = t ? "上次备份：" + new Date(+t).toLocaleString() : "还没备份过";
}
// 逐卡合并：哪边盒子高（更熟）取哪边，不互相覆盖退步
function mergeCloudIntoLocal(cloud) {
  let merged = 0;
  for (const [id, cs] of Object.entries(cloud.stats || {})) {
    const ls = stats[id];
    if (!ls || (cs.box || 0) > (ls.box || 0)) { stats[id] = cs; merged++; }
  }
  const days = new Set(JSON.parse(localStorage.getItem("jpGrammarDays") || "[]"));
  (cloud.days || []).forEach(d => days.add(d));
  localStorage.setItem("jpGrammarDays", JSON.stringify([...days]));
  for (const [id, n] of Object.entries(cloud.wrong || {})) if ((n || 0) > (wrong[id] || 0)) wrong[id] = n;
  for (const [d, n] of Object.entries(cloud.daily || {})) if ((n || 0) > (daily[d] || 0)) daily[d] = n;
  saveWrong(); saveDaily();
  saveStats();
  return merged;
}
async function backupState(manual) {
  const cfg = getCloudCfg();
  if (!cfg) { if (manual) alert("先点一次「上云」配置 Worker 地址和密钥。"); return; }
  try {
    // 先拉云端合并进本地，再上传——防止空白设备/落后设备覆盖云端的进度
    const r0 = await fetch(cfg.url + "/state?key=" + encodeURIComponent(cfg.key), { headers: { "x-key": cfg.key } });
    if (r0.ok) {
      const t0 = await r0.text();
      if (t0 && t0 !== "（空的）") mergeCloudIntoLocal(JSON.parse(t0));
    }
    const r = await fetch(cfg.url + "/state", {
      method: "POST",
      headers: { "content-type": "text/plain; charset=utf-8", "x-key": cfg.key },
      body: statePack(),
    });
    if (r.status === 403) { localStorage.removeItem("jpGrammarCloud"); if (manual) alert("密钥不对，已清除配置，请点「上云」重新输入。"); return; }
    // 调试脚印：往 /log 通道写一行备份标记（kk 读云排查用，正式版可删）
    try {
      await fetch(cfg.url + "/log", {
        method: "POST",
        headers: { "content-type": "text/plain; charset=utf-8", "x-key": cfg.key },
        body: `[state-backup] cards=${Object.keys(stats).length} result=${r.ok ? "ok" : "HTTP" + r.status} at=${new Date().toISOString()}`,
      });
    } catch {}
    if (r.ok) {
      localStorage.setItem("jpGrammarLastBackup", String(Date.now()));
      if (manual) alert("进度已备份到云（先合并后上传，不会丢进度）。");
      updateBakInfo();
    } else if (manual) alert("备份失败：" + r.status);
  } catch (e) { if (manual) alert("网络失败：" + e.message); }
}
async function restoreState(manual) {
  const cfg = getCloudCfg();
  if (!cfg) { if (manual) alert("先点一次「上云」配置 Worker 地址和密钥。"); return false; }
  try {
    const r = await fetch(cfg.url + "/state?key=" + encodeURIComponent(cfg.key), { headers: { "x-key": cfg.key } });
    if (r.status === 403) { localStorage.removeItem("jpGrammarCloud"); if (manual) alert("密钥不对，已清除配置，请点「上云」重新输入。"); return false; }
    if (!r.ok) { if (manual) alert("恢复失败：" + r.status); return false; }
    const t = await r.text();
    if (!t || t === "（空的）") { if (manual) alert("云端还没有备份。"); return false; }
    const merged = mergeCloudIntoLocal(JSON.parse(t));
    if (manual) alert(`已从云恢复：合并了 ${merged} 张卡的进度。`);
    return true;
  } catch (e) { if (manual) alert("网络失败：" + e.message); return false; }
}

$("btn-prog").onclick = () => { showProgress(); updateBakInfo(); };
// 振り仮名开关（默认开）
if (localStorage.getItem("jpGrammarRuby") === "off") document.body.classList.add("no-rt");
$("btn-ruby").onclick = () => {
  const off = document.body.classList.toggle("no-rt");
  localStorage.setItem("jpGrammarRuby", off ? "off" : "on");
};
$("btn-closeprog").onclick = () => $("overlay").style.display = "none";
$("overlay").addEventListener("click", e => { if (e.target === $("overlay")) $("overlay").style.display = "none"; });

// 上云：POST 错题日志到 Cloudflare Worker（地址和密钥首次输入后记住）
async function cloudUpload() {
  let cfg = getCloudCfg();
  if (!cfg) {
    const url = prompt("Worker 地址（形如 https://xxx.workers.dev，kk 部署后给你）：");
    if (!url) return;
    const key = prompt("密钥（kk 给你的那串）：");
    if (!key) return;
    cfg = { url: url.replace(/\/+$/, ""), key };
    try { cfg.url = new URL(cfg.url).origin; } catch {}
    localStorage.setItem("jpGrammarCloud", JSON.stringify(cfg));
  }
  const btn = $("btn-cloud");
  btn.disabled = true; btn.textContent = "上传中…";
  try {
    const r = await fetch(cfg.url + "/log", {
      method: "POST",
      headers: { "content-type": "text/plain; charset=utf-8", "x-key": cfg.key },
      body: buildLogText(),
    });
    if (r.ok) alert("已上云。跟 kk 说一声「读云」就行。");
    else if (r.status === 403) { localStorage.removeItem("jpGrammarCloud"); alert("密钥不对，已清除配置，下次点上云重新输入。"); }
    else alert("上传失败：" + r.status);
  } catch (e) { alert("网络失败：" + e.message); }
  btn.disabled = false; btn.textContent = "☁️ 上云";
}
$("btn-cloud").onclick = cloudUpload;

// 罗马音直输：拦截拉丁字母，转假名；其他输入（粘贴等）放行，判定时兜底
$("ans").addEventListener("beforeinput", e => {
  if (e.inputType === "insertText" && /^[a-zA-Z'\-]+$/.test(e.data || "")) {
    e.preventDefault();
    for (const ch of e.data.toLowerCase()) feed(ch);
    syncAns();
  } else if (e.inputType === "deleteContentBackward") {
    e.preventDefault();
    if (pending) pending = pending.slice(0, -1);
    else kanaBuf.pop();
    syncAns();
  }
});

$("btn-bak").onclick = () => backupState(true);
$("btn-res").onclick = () => { if (confirm("从云恢复会和本地合并（每张卡取更熟的进度），继续？")) restoreState(true); };

$("btn-submit").onclick = () => judge(false);
$("btn-pass").onclick = () => judge(true);
$("btn-next").onclick = next;
$("ans").addEventListener("keydown", e => { if (e.key === "Enter") judge(false); });
$("btn-next").addEventListener("keydown", e => { if (e.key === "Enter") next(); });
$("btn-export3").onclick = () => exportLog(true);
$("btn-export2").onclick = () => exportLog(true);
$("btn-restart").onclick = () => { $("summary").style.display = "none"; $("card").classList.remove("hidden"); buildQueue(false); render(); };
$("btn-force").onclick = () => { $("summary").style.display = "none"; $("card").classList.remove("hidden"); buildQueue(true); render(); };

// 启动：本地一片空白且配过云 → 自动从云恢复（新设备/清缓存后的救命绳）
(async () => {
  if (!Object.keys(stats).length && getCloudCfg()) await restoreState(false);
  buildQueue(false); render();
})();
